<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>家總管｜每週帳務</title><link rel="stylesheet" href="public-style.css"><link rel="stylesheet" href="secure-style.css"><style>
.copy-actions{display:flex;gap:6px;flex-wrap:wrap;min-width:176px}.copy-btn{border:1px solid #2a435f;background:#10243a;color:#dce9f5;border-radius:9px;padding:7px 9px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap}.copy-btn.primary{background:#183b34;border-color:#2d6658;color:#a9f2d7}.copy-btn.copied{background:#24513f;border-color:#4f9b7d;color:#d9fff0}.copy-btn:disabled{opacity:.55;cursor:not-allowed}.receipt-links{display:flex;gap:6px;flex-wrap:wrap;min-width:120px}.receipt-link{display:inline-block;border:1px solid #4d5f78;border-radius:8px;padding:6px 8px;font-size:12px;font-weight:700;text-decoration:none;color:#dce9f5;background:#172436;white-space:nowrap}
</style></head><body>
<div class="lock" id="lock"><div class="lockbox"><div class="ey">FINANCE SECURE</div><h2>每週帳務登入</h2><p>輸入管理密碼後查看完整銀行帳號與待匯款資訊</p><div class="lockrow"><input id="pw" class="secure-input" type="password" autocomplete="current-password" placeholder="管理密碼"><button id="unlock" class="unlock-btn">解鎖</button></div><div id="err" class="lockerr"></div></div></div>
<div class="app"><aside class="side"><div class="brand">家總管<small>HOUSE OPS · SECURE</small></div><nav class="nav"><a href="vacancy.html">空房系統</a><a href="checkout.html">退租紀錄</a><a class="on" href="weekly-accounting.html">每週帳務</a></nav><div class="foot"><button id="forget" class="secure-btn" style="width:100%">鎖定此裝置</button><a href="index.html">← 系統首頁</a></div></aside>
<main class="main"><header class="top"><div><div class="ey">FRIDAY SETTLEMENT</div><h1>每週報修／退租帳務</h1><div class="sub">內部完整資料｜只列待匯款；完成後自動從清單移除，同週同廠商自動合計</div></div><div class="chip" id="updated">● 已加密</div></header><section class="stats"><div class="st"><span>待付廠商</span><b id="sVendor">$0</b></div><div class="st"><span>待退房客</span><b id="sRefund">$0</b></div><div class="st"><span>待處理筆數</span><b id="sPending">0</b></div><div class="st"><span>顯示範圍</span><b style="font-size:18px">僅待匯款</b></div></section><section class="panel"><h2>待匯款完整資訊</h2><div class="tbl"><table><thead><tr><th>類型</th><th>收款人</th><th>物件</th><th>項目</th><th>金額</th><th>銀行代號</th><th>完整銀行帳號</th><th>退款期限</th><th>結算週五</th><th>收據</th><th>快速複製</th></tr></thead><tbody id="tb"></tbody></table></div></section></main></div><script src="secure-data.js"></script><script src="trusted-device.js"></script><script src="ops-secure.js"></script><script src="finance-secure.js"></script><script src="secure-app.js"></script><script>
const $=s=>document.querySelector(s),E=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m])),M=n=>"$"+Math.round(Number(n)||0).toLocaleString("zh-TW"),vendorKey=s=>String(s??"").trim().replace(/\s+/g,"").toLowerCase();let S=null,DISPLAY=[];
function groupedPending(){const pending=S.ops.weekly_accounts.filter(x=>x.status!=="paid"),groups=new Map(),out=[];for(const r of pending){if(r.kind!=="vendor"){out.push({...r,_grouped:false});continue}const nk=vendorKey(r.party),k=(r.settlement_date||"")+"|"+(nk||("id:"+r.id));if(!groups.has(k))groups.set(k,{...r,_grouped:true,_items:[],amount:0});const g=groups.get(k);g._items.push(r);g.amount+=Number(r.amount)||0}for(const g of groups.values()){g.property_label=[...new Set(g._items.map(x=>x.property_label).filter(Boolean))].join("、");g.description=g._items.length===1?(g._items[0].description||"維修款"):("共 "+g._items.length+" 筆｜"+g._items.map(x=>[x.property_label,x.description].filter(Boolean).join("：")).filter(Boolean).join("；"));g.due_date=g._items.map(x=>x.due_date).filter(Boolean).sort()[0]||"";out.push(g)}return out.sort((x,y)=>String(x.settlement_date).localeCompare(String(y.settlement_date))||String(x.party||"").localeCompare(String(y.party||"")))}
function bankFor(r){const fm=new Map((S.finance.accounts||[]).map(x=>[x.id,x])),ids=r._grouped?r._items.map(x=>x.id):[r.id],rows=ids.map(id=>fm.get(id)||{}),codes=[...new Set(rows.map(x=>x.bank_code).filter(Boolean))],accounts=[...new Set(rows.map(x=>x.bank_account).filter(Boolean))],names=[...new Set(rows.map(x=>x.bank_name).filter(Boolean))];if(codes.length>1||accounts.length>1||names.length>1)return{bank_code:"⚠ 帳號不一致",bank_account:"請逐筆確認",bank_name:""};return{bank_code:codes[0]||"—",bank_account:accounts[0]||"—",bank_name:names[0]||""}}
function receiptItems(r){return(r._grouped?r._items:[r]).filter(x=>x&&x.receipt_url)}
function receiptCell(r){const rows=receiptItems(r);if(!rows.length)return"—";return '<div class="receipt-links">'+rows.map(x=>'<button type="button" class="receipt-link" data-receipt-url="'+E(x.receipt_url)+'">'+E((x.property_label||"帳務")+" 收據")+'</button>').join("")+'</div>'}
function receiptText(r){return receiptItems(r).map(x=>"收據："+(x.property_label||"帳務")+"｜"+x.receipt_url)}
function render(session){S=session;$("#lock").style.display="none";const raw=S.ops.weekly_accounts.filter(x=>x.status!=="paid"),a=groupedPending();DISPLAY=a;$("#sVendor").textContent=M(raw.filter(x=>x.kind==="vendor").reduce((s,x)=>s+(Number(x.amount)||0),0));$("#sRefund").textContent=M(raw.filter(x=>x.kind==="refund").reduce((s,x)=>s+(Number(x.amount)||0),0));$("#sPending").textContent=a.length;$("#updated").textContent="● 更新 "+new Date(S.ops.updated_at).toLocaleString("zh-TW");$("#tb").innerHTML=a.map((r,i)=>{const b=bankFor(r),detail=r.kind==="vendor"&&r._grouped&&r._items.length>1?'<div class="meta">同廠商 '+r._items.length+' 筆已合計</div>':"",canCopy=b.bank_account&&b.bank_account!=="—"&&!String(b.bank_account).includes("確認");return `<tr><td><span class="badge ${r.kind==="vendor"?"vendor":"refund"}">${r.kind==="vendor"?"廠商":"退租退款"}</span></td><td>${E(r.party||"—")}${detail}</td><td><b>${E(r.property_label||"—")}</b></td><td>${E(r.description||"—")}</td><td class="money">${M(r.amount)}</td><td class="account">${E(b.bank_code)}${b.bank_name?"（"+E(b.bank_name)+"）":""}</td><td class="account">${E(b.bank_account)}</td><td>${E(r.due_date||"—")}</td><td>${E(r.settlement_date||"—")}</td><td>${receiptCell(r)}</td><td><div class="copy-actions"><button class="copy-btn primary" data-copy="account" data-i="${i}" ${canCopy?"":"disabled"}>複製帳號</button><button class="copy-btn" data-copy="full" data-i="${i}">複製完整資訊</button></div></td></tr>`}).join("")}
async function copyText(text){if(navigator.clipboard&&window.isSecureContext){try{await navigator.clipboard.writeText(text);return true}catch(_){}}const ta=document.createElement("textarea");ta.value=text;ta.setAttribute("readonly","");ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();ta.setSelectionRange(0,ta.value.length);let ok=false;try{ok=document.execCommand("copy")}catch(_){}ta.remove();return ok}
function fullInfo(r,b){const type=r.kind==="vendor"?"廠商":"退租退款",lines=["類型："+type,"收款人："+(r.party||"—"),"物件："+(r.property_label||"—"),"項目："+(r.description||"—"),"金額："+M(r.amount),"銀行："+(b.bank_code||"—")+(b.bank_name?"（"+b.bank_name+"）":""),"銀行帳號："+(b.bank_account||"—")];if(r.due_date)lines.push("退款期限："+r.due_date);if(r.settlement_date)lines.push("結算週五："+r.settlement_date);lines.push(...receiptText(r));return lines.join("\n")}
function flash(btn,ok){const old=btn.textContent;btn.textContent=ok?"已複製":"複製失敗";btn.classList.add("copied");setTimeout(()=>{btn.textContent=old;btn.classList.remove("copied")},1400)}
$("#tb").addEventListener("click",async e=>{const receipt=e.target.closest("button[data-receipt-url]");if(receipt){const url=receipt.dataset.receiptUrl||"";if(/^https:\/\/drive\.google\.com\//.test(url))window.open(url,"_blank","noopener,noreferrer");return}const btn=e.target.closest("button[data-copy]");if(!btn)return;const r=DISPLAY[Number(btn.dataset.i)];if(!r)return;const b=bankFor(r);const text=btn.dataset.copy==="account"?String(b.bank_account||""):fullInfo(r,b);const ok=await copyText(text);flash(btn,ok)});
async function unlock(){try{render(await HouseSecureApp.unlock($("#pw").value));$("#pw").value=""}catch(e){$("#err").textContent=e?.message||"無法解鎖"}}$("#unlock").onclick=unlock;$("#pw").onkeydown=e=>{if(e.key==="Enter")unlock()};$("#forget").onclick=async()=>{await HouseSecureApp.forget();location.reload()};(async()=>{const s=await HouseSecureApp.auto();if(s)render(s)})();
</script></body></html>
