<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>家總管｜每週帳務</title><link rel="stylesheet" href="public-style.css"></head><body>
<div class="app"><aside class="side"><div class="brand">家總管<small>HOUSE OPS · PUBLIC</small></div><nav class="nav"><a href="vacancy.html">空房系統</a><a href="checkout.html">退租紀錄</a><a class="on" href="weekly-accounting.html">每週帳務</a></nav><div class="foot"><a href="index.html">← 系統首頁</a></div></aside>
<main class="main"><header class="top"><div><div class="ey">PUBLIC FRIDAY SETTLEMENT</div><h1>每週報修／退租帳務</h1><div class="sub">公開唯讀｜每週五集中查看廠商應付款與退租房客應退款</div></div><div class="chip" id="updated">● 讀取中</div></header>
<div class="notice">公開頁只顯示匯款必要摘要與帳號末四碼，不顯示完整銀行帳號，也不提供任何付款或修改操作</div>
<section class="stats"><div class="st"><span>待付廠商</span><b id="sVendor">$0</b></div><div class="st"><span>待退房客</span><b id="sRefund">$0</b></div><div class="st"><span>待處理筆數</span><b id="sPending">0</b></div><div class="st"><span>已完成金額</span><b id="sPaid">$0</b></div></section>
<section class="panel"><h2>週五結算清單</h2><div class="tbl"><table><thead><tr><th>狀態</th><th>類型</th><th>收款人</th><th>物件</th><th>項目</th><th>金額</th><th>銀行摘要</th><th>結算週五</th></tr></thead><tbody id="tb"></tbody></table></div></section>
</main></div><script src="public-data.js"></script><script>
const D=window.HOUSE_PUBLIC_DATA,$=s=>document.querySelector(s),E=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m])),M=n=>"$"+Math.round(Number(n)||0).toLocaleString("zh-TW");
const a=D.weekly_accounts,p=a.filter(x=>x.status!=="paid");$("#sVendor").textContent=M(p.filter(x=>x.kind==="vendor").reduce((s,x)=>s+x.amount,0));$("#sRefund").textContent=M(p.filter(x=>x.kind==="refund").reduce((s,x)=>s+x.amount,0));$("#sPending").textContent=p.length;$("#sPaid").textContent=M(a.filter(x=>x.status==="paid").reduce((s,x)=>s+x.amount,0));$("#updated").textContent="● 更新 "+new Date(D.updated_at).toLocaleString("zh-TW");$("#tb").innerHTML=a.sort((x,y)=>String(x.settlement_date).localeCompare(String(y.settlement_date))).map(r=>`<tr><td><span class="badge ${r.status==="paid"?"paid":"pending"}">${r.status==="paid"?"已完成":"待處理"}</span></td><td><span class="badge ${r.kind==="vendor"?"vendor":"refund"}">${r.kind==="vendor"?"廠商":"退租退款"}</span></td><td>${E(r.party||"—")}</td><td><b>${E(r.property_label||"—")}</b></td><td>${E(r.description||"—")}</td><td class="money">${M(r.amount)}</td><td>${E(r.bank_display||"—")}</td><td>${E(r.settlement_date||"—")}</td></tr>`).join("");
</script></body></html>
