<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>家總管｜每週帳務</title><link rel="stylesheet" href="public-style.css"><link rel="stylesheet" href="secure-style.css"></head><body>
<div class="lock" id="lock"><div class="lockbox"><div class="ey">FINANCE SECURE</div><h2>每週帳務登入</h2><p>輸入管理密碼後查看完整銀行帳號與待匯款資訊</p><div class="lockrow"><input id="pw" class="secure-input" type="password" autocomplete="current-password" placeholder="管理密碼"><button id="unlock" class="unlock-btn">解鎖</button></div><div id="err" class="lockerr"></div></div></div>
<div class="app"><aside class="side"><div class="brand">家總管<small>HOUSE OPS · SECURE</small></div><nav class="nav"><a href="vacancy.html">空房系統</a><a href="checkout.html">退租紀錄</a><a class="on" href="weekly-accounting.html">每週帳務</a></nav><div class="foot"><button id="forget" class="secure-btn" style="width:100%">鎖定此裝置</button><a href="index.html">← 系統首頁</a></div></aside>
<main class="main"><header class="top"><div><div class="ey">FRIDAY SETTLEMENT</div><h1>每週報修／退租帳務</h1><div class="sub">內部完整資料｜只列待匯款；完成後自動從清單移除，同週同廠商自動合計</div></div><div class="chip" id="updated">● 已加密</div></header><section class="stats"><div class="st"><span>待付廠商</span><b id="sVendor">$0</b></div><div class="st"><span>待退房客</span><b id="sRefund">$0</b></div><div class="st"><span>待處理筆數</span><b id="sPending">0</b></div><div class="st"><span>顯示範圍</span><b style="font-size:18px">僅待匯款</b></div></section><section class="panel"><h2>待匯款完整資訊</h2><div class="tbl"><table><thead><tr><th>類型</th><th>收款人</th><th>物件</th><th>項目</th><th>金額</th><th>銀行代號</th><th>完整銀行帳號</th><th>退款期限</th><th>結算週五</th></tr></thead><tbody id="tb"></tbody></table></div></section></main></div><script src="secure-data.js"></script><script src="trusted-device.js"></script><script src="ops-secure.js"></script><script src="finance-secure.js"></script><script src="secure-app.js"></script><script>
const $=s=>document.querySelector(s),E=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m])),M=n=>"$"+Math.round(Number(n)||0).toLocaleString("zh-TW"),vendorKey=s=>String(s??"").trim().replace(/\s+/g,"").toLowerCase();let S=null;
function groupedPending(){const pending=S.ops.weekly_accounts.filter(x=>x.status!=="paid"),groups=new Map(),out=[];for(const r of pending){if(r.kind!=="vendor"){out.push({...r,_grouped:false});continue}const nk=vendorKey(r.party),k=(r.settlement_date||"")+"|"+(nk||("id:"+r.id));if(!groups.has(k))groups.set(k,{...r,_grouped:true,_items:[],amount:0});const g=groups.get(k);g._items.push(r);g.amount+=Number(r.amount)||0}for(const g of groups.values()){g.property_label=[...new Set(g._items.map(x=>x.property_label).filter(Boolean))].join("、");g.description=g._items.length===1?(g._items[0].description||"維修款"):("共 "+g._items.length+" 筆｜"+g._items.map(x=>[x.property_label,x.description].filter(Boolean).join("：")).filter(Boolean).join("；"));g.due_date=g._items.map(x=>x.due_date).filter(Boolean).sort()[0]||"";out.push(g)}return out.sort((x,y)=>String(x.settlement_date).localeCompare(String(y.settlement_date))||String(x.party||"").localeCompare(String(y.party||"")))}
function bankFor(r){const fm=new Map((S.finance.accounts||[]).map(x=>[x.id,x])),ids=r._grouped?r._items.map(x=>x.id):[r.id],rows=ids.map(id=>fm.get(id)||{}),codes=[...new Set(rows.map(x=>x.bank_code).filter(Boolean))],accounts=[...new Set(rows.map(x=>x.bank_account).filter(Boolean))];if(codes.length>1||accounts.length>1)return{bank_code:"⚠ 帳號不一致",bank_account:"請逐筆確認"};return{bank_code:codes[0]||"—",bank_account:accounts[0]||"—"}}
function render(session){S=session;$("#lock").style.display="none";const raw=S.ops.weekly_accounts.filter(x=>x.status!=="paid"),a=groupedPending();$("#sVendor").textContent=M(raw.filter(x=>x.kind==="vendor").reduce((s,x)=>s+(Number(x.amount)||0),0));$("#sRefund").textContent=M(raw.filter(x=>x.kind==="refund").reduce((s,x)=>s+(Number(x.amount)||0),0));$("#sPending").textContent=a.length;$("#updated").textContent="● 更新 "+new Date(S.ops.updated_at).toLocaleString("zh-TW");$("#tb").innerHTML=a.map(r=>{const b=bankFor(r),detail=r.kind==="vendor"&&r._grouped&&r._items.length>1?'<div class="meta">同廠商 '+r._items.length+' 筆已合計</div>':"";return `<tr><td><span class="badge ${r.kind==="vendor"?"vendor":"refund"}">${r.kind==="vendor"?"廠商":"退租退款"}</span></td><td>${E(r.party||"—")}${detail}</td><td><b>${E(r.property_label||"—")}</b></td><td>${E(r.description||"—")}</td><td class="money">${M(r.amount)}</td><td class="account">${E(b.bank_code)}</td><td class="account">${E(b.bank_account)}</td><td>${E(r.due_date||"—")}</td><td>${E(r.settlement_date||"—")}</td></tr>`}).join("")}
async function unlock(){try{render(await HouseSecureApp.unlock($("#pw").value));$("#pw").value=""}catch(e){$("#err").textContent=e?.message||"無法解鎖"}}$("#unlock").onclick=unlock;$("#pw").onkeydown=e=>{if(e.key==="Enter")unlock()};$("#forget").onclick=async()=>{await HouseSecureApp.forget();location.reload()};(async()=>{const s=await HouseSecureApp.auto();if(s)render(s)})();
</script></body></html>
