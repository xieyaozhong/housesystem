<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>家總管｜手機快速登入</title>
<style>
:root{--b:#07111d;--p:#0d1a2a;--l:#22364f;--t:#f4f8fc;--m:#8fa5bb;--g:#79e2b8;--a:#82b7ff;--r:#ff9e9e}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0,#18324f,#07111d 55%);color:var(--t);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif}
.login{min-height:100vh;display:grid;place-items:center;padding:18px}.card{width:min(470px,100%);background:#0b1829;border:1px solid #2b435f;border-radius:24px;padding:24px;box-shadow:0 25px 80px #0006}
.ey{color:var(--g);font-size:10px;letter-spacing:.18em;font-weight:800}h1{font-size:27px;margin:8px 0}.sub{color:var(--m);font-size:12px;line-height:1.7}
.f{width:100%;padding:12px 13px;border-radius:12px;border:1px solid var(--l);background:#091625;color:#fff;outline:none;margin-top:6px}.f:focus{border-color:#54779c}
.lbl{display:block;color:#91a7bd;font-size:10px;margin-top:14px}.btn{width:100%;border:0;border-radius:12px;padding:12px 14px;margin-top:14px;background:var(--g);color:#062519;font-weight:850;cursor:pointer}
.status{margin-top:14px;border:1px solid #2b4b64;background:#0d2137;border-radius:13px;padding:12px;color:#b9d4ed;font-size:11px;line-height:1.7}
.trust{display:flex;gap:9px;align-items:flex-start;margin-top:14px;color:#c5d1dc;font-size:11px;line-height:1.5}.trust input{margin-top:2px}.bad{color:#ffb0b0}.good{color:#9ceacc}
.app{display:none;position:fixed;inset:0;background:#07111d}.bar{height:54px;display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid #20364f;background:#091625}
.brand{font-weight:850;margin-right:auto}.navbtn,.exit{border:1px solid #2a405b;background:#102038;color:#d8e5f1;border-radius:10px;padding:8px 10px;font-size:12px}.navbtn.on{background:#18314d;color:#fff}.exit{color:#ffbbbb}
.frame{position:absolute;left:0;right:0;top:54px;bottom:0;width:100%;height:calc(100% - 54px);border:0;background:#07111d}
@media(max-width:520px){.bar{gap:5px}.brand{font-size:13px}.navbtn,.exit{padding:8px 8px;font-size:11px}}
</style>
</head>
<body>
<section id="login" class="login">
<div class="card">
<div class="ey">MOBILE QUICK LOGIN</div>
<h1>家總管手機快速登入</h1>
<div id="pairMsg" class="sub">正在讀取配對設定…</div>
<label class="lbl">管理員 Email</label>
<input id="email" class="f" type="email" autocomplete="username" placeholder="Firebase 管理員帳號">
<label class="lbl">Firebase 登入密碼</label>
<input id="firebasePw" class="f" type="password" autocomplete="current-password" placeholder="第一次登入輸入一次">
<label class="lbl">家總管管理密碼</label>
<input id="masterPw" class="f" type="password" autocomplete="off" placeholder="第一次登入輸入一次">
<label class="trust"><input id="trust" type="checkbox" checked><span><b>信任此手機</b><br>之後開啟這個手機入口會自動登入並解鎖。明文管理密碼不會直接存進 localStorage。</span></label>
<button id="go" class="btn">登入並開始同步</button>
<div id="status" class="status">等待登入</div>
</div>
</section>
<section id="app" class="app">
<div class="bar">
<div class="brand">家總管</div>
<button class="navbtn on" data-src="vacancy.html">空房</button>
<button class="navbtn" data-src="checkout.html">退租</button>
<button id="sync" class="navbtn" data-src="sync-setup.html">同步</button>
<button id="exit" class="exit">鎖定</button>
</div>
<iframe id="frame" class="frame" src="about:blank"></iframe>
</section>
<script src="secure-data.js"></script>
<script src="trusted-device.js"></script>
<script type="module" src="cloud-sync.js"></script>
<script>
const $=s=>document.querySelector(s);
let MASTER=null, launched=false;
const decodePair=s=>JSON.parse(decodeURIComponent(escape(atob(s.replace(/-/g,'+').replace(/_/g,'/').padEnd(Math.ceil(s.length/4)*4,'=')))));
function cfg(){try{return JSON.parse(localStorage.getItem('house_firebase_config_v1')||'null')}catch(e){return null}}
(function importPair(){
  try{
    const m=location.hash.match(/(?:^#|&)pair=([^&]+)/);
    if(m){
      const p=decodePair(m[1]);
      if(p?.c?.apiKey&&p.c.authDomain&&p.c.projectId&&p.c.appId){
        localStorage.setItem('house_firebase_config_v1',JSON.stringify(p.c));
        if(p.email){localStorage.setItem('house_admin_email_v1',p.email);$('#email').value=p.email}
        history.replaceState(null,'',location.pathname);
        $('#pairMsg').innerHTML='<span class="good">✓ 配對設定已匯入</span>，這台手機只需登入一次'
      }
    }
  }catch(e){$('#pairMsg').innerHTML='<span class="bad">配對連結格式錯誤</span>'}
  if(!$('#email').value)$('#email').value=localStorage.getItem('house_admin_email_v1')||'';
  if(!cfg())$('#pairMsg').innerHTML='<span class="bad">尚未取得 Firebase 設定</span>，請先用電腦產生手機配對連結'
})();
function paint(s={}){
  const u=s.user;
  $('#status').innerHTML=`雲端：<b>${s.message||s.mode||'初始化中'}</b>${u?`<br>帳號：${u.email||'—'}`:''}${s.error?`<br><span class="bad">${s.error}</span>`:''}`;
  if(u?.email){$('#email').value=u.email;localStorage.setItem('house_admin_email_v1',u.email)}
}
window.addEventListener('house-cloud-state',e=>{paint(e.detail);tryAutoStart()});
window.addEventListener('house-cloud-ready',()=>{paint(window.HouseCloud?.getStatus?.()||{});tryAutoStart()});
async function validateMaster(pw){const c=cfg();if(!c)throw new Error('尚未設定 Firebase');await window.HouseTrusted.trust(pw,c.projectId);return true}
async function tryAutoStart(){
  if(launched||!window.HouseCloud||!window.HouseTrusted)return;
  const user=window.HouseCloud.currentUser?.();if(!user)return;
  try{if(await window.HouseTrusted.has()){MASTER=await window.HouseTrusted.getRememberedPassword();if(MASTER){launchApp();return}}}catch(e){}
}
function launchApp(){if(!MASTER)return;launched=true;$('#login').style.display='none';$('#app').style.display='block';loadPage('vacancy.html')}
function injectUnlock(){
  const f=$('#frame');
  try{const d=f.contentDocument;if(!d||!MASTER)return;const input=d.querySelector('#pw');const btn=d.querySelector('#unlock')||d.querySelector('#unlockBtn');if(input&&btn){input.value=MASTER;setTimeout(()=>btn.click(),60)}}catch(e){}
}
function loadPage(src){document.querySelectorAll('.navbtn[data-src]').forEach(b=>b.classList.toggle('on',b.dataset.src===src));$('#frame').src=src}
$('#frame').addEventListener('load',()=>{injectUnlock();setTimeout(injectUnlock,350)});
document.querySelectorAll('.navbtn[data-src]').forEach(b=>b.onclick=()=>loadPage(b.dataset.src));
$('#exit').onclick=()=>{MASTER=null;launched=false;$('#frame').src='about:blank';$('#app').style.display='none';$('#login').style.display='grid';$('#masterPw').value='';$('#firebasePw').value=''};
$('#go').onclick=async()=>{
  const c=cfg(),email=$('#email').value.trim(),fp=$('#firebasePw').value,mp=$('#masterPw').value;
  if(!c){alert('請先從電腦產生「手機配對連結」再開啟');return}
  if(!email||!fp||!mp){alert('第一次登入請填寫 Email、Firebase 密碼與家總管管理密碼');return}
  $('#go').disabled=true;$('#go').textContent='登入與驗證中…';
  try{
    await window.HouseCloud.login(email,fp);
    if($('#trust').checked)await validateMaster(mp);
    else{
      const b=await crypto.subtle.importKey('raw',new TextEncoder().encode(mp),'PBKDF2',false,['deriveKey']);
      const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:Uint8Array.from(atob(window.HOUSE_VAULT.salt),c=>c.charCodeAt(0)),iterations:window.HOUSE_VAULT.iter,hash:'SHA-256'},b,{name:'AES-GCM',length:256},false,['decrypt']);
      await window.HouseTrusted.decryptVaultWithKey(window.HOUSE_VAULT,k);
    }
    MASTER=mp;localStorage.setItem('house_admin_email_v1',email);$('#firebasePw').value='';$('#masterPw').value='';
    $('#status').innerHTML='<span class="good">✓ 手機登入完成，現在會直接跨裝置同步</span>';launchApp();
  }catch(e){$('#status').innerHTML='<span class="bad">登入失敗：'+String(e.message||e)+'</span>'}
  finally{$('#go').disabled=false;$('#go').textContent='登入並開始同步'}
};
setTimeout(tryAutoStart,900);
</script>
</body></html>
