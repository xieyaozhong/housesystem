<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07111d"><title>家總管｜手機快速登入</title><link rel="stylesheet" href="setup.css"><style>.login{min-height:100dvh;display:grid;place-items:center;padding:18px}.card{width:min(480px,100%)}.card h1{font-size:30px}.app{position:fixed;inset:0;background:var(--bg)}.bar{height:60px;display:flex;align-items:center;gap:7px;padding:8px 10px;border-bottom:1px solid var(--line)}.bar .brand{margin-right:auto;font-size:16px}.bar button{padding:8px 10px}.on{background:#23476a}.frame{position:absolute;left:0;top:60px;width:100%;height:calc(100% - 60px);border:0}.card .primary{width:100%}@media(max-width:400px){.bar{gap:4px}.bar button{padding:8px;font-size:12px}}</style></head>
<body><section id="login" class="login"><div class="panel card"><div class="ey">YOUR HOUSE OPS, ANYWHERE</div><h1>手機登入，一次就好。</h1><p id="pairMsg" class="sub">正在讀取配對設定…</p>
<form id="loginForm"><label for="email" class="lbl">Firebase 管理員 Email</label><input id="email" class="f" type="email" autocomplete="username" required><div id="firebaseFields"><label for="firebasePw" class="lbl">Firebase 登入密碼</label><input id="firebasePw" class="f" type="password" autocomplete="current-password"></div>
<label for="masterPw" class="lbl">家總管管理密碼</label><input id="masterPw" class="f" type="password" autocomplete="off" required><label class="trust"><input id="trust" type="checkbox"><span><b>信任這台私人手機</b><br>下次開啟可自動解鎖。裝置只保存解鎖金鑰；手動鎖定後仍需輸入管理密碼。</span></label><div class="actions"><button id="go" class="btn primary" disabled>登入並開啟家總管</button></div></form><div id="status" class="status" role="status" aria-live="polite">正在準備登入…</div><div class="actions"><a href="sync-setup.html">設定與疑難排解</a><a href="index.html">回首頁</a></div></div></section>
<section id="app" class="app" hidden><nav class="bar" aria-label="房務功能"><span class="brand">家總管</span><button class="btn on" data-src="vacancy.html">空房</button><button class="btn" data-src="checkout.html">退租</button><button class="btn" data-src="sync-setup.html">同步</button><button id="exit" class="btn">鎖定</button></nav><iframe id="frame" class="frame" title="家總管工作區" src="about:blank"></iframe></section>
<script src="house-core.js"></script><script src="secure-data.js"></script><script src="trusted-device.js"></script><script src="mobile-login.js"></script><script type="module" src="cloud-sync.js"></script></body></html>
