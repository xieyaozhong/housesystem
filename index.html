<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1220"><title>家總管｜房務管理系統</title><link rel="stylesheet" href="public-style.css"><link rel="stylesheet" href="secure-style.css"><style>.home{max-width:1080px;margin:auto;padding:34px 22px 60px}.hero h1{font-size:clamp(42px,7vw,76px);line-height:.98;margin:0 0 22px;letter-spacing:-.05em}.hero p{color:#a9bbcf;line-height:1.8;max-width:720px}.gridhome{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:34px}.homecard{display:block;text-decoration:none;color:inherit;border:1px solid #22364f;background:#0d1828;border-radius:20px;padding:22px;min-height:170px}.homecard h2{margin:22px 0 8px}.topline{display:flex;justify-content:space-between;gap:12px;align-items:center}.tag{font-size:11px;border:1px solid #285846;border-radius:999px;padding:7px 10px;color:#9ceacc}.statsHome{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:28px}.statsHome .st{border:1px solid #22364f;background:#0d1a2a;border-radius:16px;padding:15px}.statsHome b{display:block;font-size:28px;margin-top:6px}@media(max-width:700px){.gridhome,.statsHome{grid-template-columns:1fr}.home{padding:22px 14px}.hero h1{font-size:46px}}</style></head><body>
<div class="lock" id="lock"><div class="lockbox"><div class="ey">HOUSE OPS SECURE</div><h2>家總管管理登入</h2><p>全站統一使用管理密碼。此裝置成功解鎖後可記住授權，之後直接進入系統</p><div class="lockrow"><input id="pw" class="secure-input" type="password" autocomplete="current-password" placeholder="管理密碼"><button id="unlock" class="unlock-btn">解鎖</button></div><div id="err" class="lockerr"></div></div></div>
<main class="home"><div class="topline"><div><b>家總管 HOUSE OPS</b><div class="sub">內部管理系統</div></div><button id="forget" class="secure-btn">鎖定此裝置</button></div><section class="hero"><div class="ey" style="margin-top:48px">SECURE HOUSE OPERATIONS</div><h1>所有房務資料<br>集中管理</h1><p>空房、退租、退款與每週帳務皆為內部資料，必須解鎖後才可查看完整資訊</p></section><section class="statsHome"><div class="st"><span>目前空房</span><b id="sv">—</b></div><div class="st"><span>待退款</span><b id="sr">—</b></div><div class="st"><span>待匯款筆數</span><b id="sw">—</b></div></section><section class="gridhome"><a class="homecard" href="vacancy.html"><div class="ey">VACANCY</div><h2>空房系統</h2><p class="sub">完整物件、門禁、備註與房間狀態</p></a><a class="homecard" href="checkout.html"><div class="ey">MOVE OUT</div><h2>退租紀錄</h2><p class="sub">完整退款、電費、銀行與結案資料</p></a><a class="homecard" href="weekly-accounting.html"><div class="ey">FINANCE</div><h2>每週帳務</h2><p class="sub">完整匯款帳號、廠商合計與待處理款項</p></a></section><div class="notice" id="updated"></div></main><script src="secure-data.js"></script><script src="trusted-device.js"></script><script src="ops-secure.js"></script><script src="finance-secure.js"></script><script src="secure-app.js"></script><script>
const $=s=>document.querySelector(s);
function render(S){const o=S.ops;$("#sv").textContent=o.vacancies.length;$("#sr").textContent=o.checkouts.filter(x=>x.refund_status!=="paid").length;$("#sw").textContent=o.weekly_accounts.filter(x=>x.status!=="paid").length;$("#updated").textContent="資料更新："+new Date(o.updated_at).toLocaleString("zh-TW");$("#lock").style.display="none"}
async function unlock(){try{const s=await HouseSecureApp.unlock($("#pw").value);$("#pw").value="";render(s)}catch(e){$("#err").textContent=e?.message||"無法解鎖"}}
$("#unlock").onclick=unlock;$("#pw").onkeydown=e=>{if(e.key==="Enter")unlock()};$("#forget").onclick=async()=>{await HouseSecureApp.forget();location.reload()};(async()=>{const s=await HouseSecureApp.auto();if(s)render(s)})();
</script></body></html>
