<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>家總管｜退租紀錄</title><link rel="stylesheet" href="public-style.css"><link rel="stylesheet" href="secure-style.css"></head><body>
<div class="lock" id="lock"><div class="lockbox"><div class="ey">MOVE OUT SECURE</div><h2>退租紀錄登入</h2><p>輸入管理密碼後查看完整退款、銀行與計算資訊</p><div class="lockrow"><input id="pw" class="secure-input" type="password" autocomplete="current-password" placeholder="管理密碼"><button id="unlock" class="unlock-btn">解鎖</button></div><div id="err" class="lockerr"></div></div></div>
<div class="app"><aside class="side"><div class="brand">家總管<small>HOUSE OPS · SECURE</small></div><nav class="nav"><a href="vacancy.html">空房系統</a><a class="on" href="checkout.html">退租紀錄</a><a href="weekly-accounting.html">每週帳務</a></nav><div class="foot"><button id="forget" class="secure-btn" style="width:100%">鎖定此裝置</button><a href="index.html">← 系統首頁</a></div></aside>
<main class="main"><header class="top"><div><div class="ey">FULL MOVE-OUT RECORDS</div><h1>退租紀錄</h1><div class="sub">內部完整資料｜包含已完成退款的金額、日期、計算與銀行資訊</div></div><div class="chip" id="updated">● 已加密</div></header><section class="stats"><div class="st"><span>退租紀錄</span><b id="sAll">0</b></div><div class="st"><span>待退款</span><b id="sPending">0</b></div><div class="st"><span>已退款</span><b id="sPaid">0</b></div><div class="st"><span>待退總額</span><b id="sMoney">$0</b></div></section><section class="panel"><h2>退租完整明細</h2><div class="tbl"><table><thead><tr><th>狀態</th><th>房間</th><th>地址</th><th>點交日</th><th>應退金額</th><th>預計退款日</th><th>完成日</th><th>銀行代號</th><th>完整帳號</th><th>計算／備註</th></tr></thead><tbody id="tb"></tbody></table></div></section></main></div><script src="secure-data.js"></script><script src="trusted-device.js"></script><script src="ops-secure.js"></script><script src="finance-secure.js"></script><script src="secure-app.js"></script><script>
const $=s=>document.querySelector(s),E=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m])),M=n=>"$"+Math.round(Number(n)||0).toLocaleString("zh-TW");
let ACTIVE_SESSION=null;
function render(S){ACTIVE_SESSION=S;const o=S.ops,fin=new Map((S.finance.accounts||[]).map(x=>[x.id,x]));$("#lock").style.display="none";const a=o.checkouts;$("#sAll").textContent=a.length;$("#sPending").textContent=a.filter(x=>x.refund_status!=="paid").length;$("#sPaid").textContent=a.filter(x=>x.refund_status==="paid").length;$("#sMoney").textContent=M(a.filter(x=>x.refund_status!=="paid").reduce((s,x)=>s+(Number(x.refund_amount)||0),0));$("#updated").textContent="● 更新 "+new Date(o.updated_at).toLocaleString("zh-TW");$("#tb").innerHTML=a.map(r=>{const w=o.weekly_accounts.find(x=>x.kind==="refund"&&x.property_label===r.room),b=fin.get(w?.id)||{};return `<tr><td><span class="badge ${r.refund_status==="paid"?"paid":"pending"}">${r.refund_status==="paid"?"已退款":"待退款"}</span></td><td><b>${E(r.room)}</b></td><td>${E(r.address)}</td><td>${E(r.checkout_date)}</td><td class="money">${M(r.refund_amount)}</td><td>${E(r.refund_due_date||"—")}</td><td>${E(r.refund_paid_date||"—")}</td><td class="account">${E(b.bank_code||"—")}${b.bank_name?"（"+E(b.bank_name)+"）":""}</td><td class="account">${b.bank_account?E(b.bank_account):w?.id==="refund-pingde-401-20261002"?'<div class="lockrow"><input type="text" inputmode="numeric" autocomplete="off" class="secure-input" data-refund-account placeholder="安全輸入退款帳號" aria-label="平德401退款帳號"><button type="button" class="unlock-btn" data-save-account>加密儲存</button></div>':"—"}</td><td>${E(r.note||"—")}</td></tr>`}).join("")}
$("#tb").addEventListener("click",async e=>{
  const btn=e.target.closest("button[data-save-account]");
  if(!btn||!ACTIVE_SESSION)return;
  const field=btn.parentElement?.querySelector("input[data-refund-account]");
  if(!field)return;
  try{
    await HouseSecureApp.saveRefundAccount(ACTIVE_SESSION,"refund-pingde-401-20261002",field.value);
    render(ACTIVE_SESSION);
  }catch(err){alert(err?.message||"加密儲存失敗")}
});
async function unlock(){try{render(await HouseSecureApp.unlock($("#pw").value));$("#pw").value=""}catch(e){$("#err").textContent=e?.message||"無法解鎖"}}$("#unlock").onclick=unlock;$("#pw").onkeydown=e=>{if(e.key==="Enter")unlock()};$("#forget").onclick=async()=>{await HouseSecureApp.forget();location.reload()};(async()=>{const s=await HouseSecureApp.auto();if(s)render(s)})();
</script></body></html>
