<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>家總管｜退租紀錄</title><link rel="stylesheet" href="public-style.css"></head><body>
<div class="app"><aside class="side"><div class="brand">家總管<small>HOUSE OPS · PUBLIC</small></div><nav class="nav"><a href="vacancy.html">空房系統</a><a class="on" href="checkout.html">退租紀錄</a><a href="weekly-accounting.html">每週帳務</a></nav><div class="foot"><a href="index.html">← 系統首頁</a></div></aside>
<main class="main"><header class="top"><div><div class="ey">PUBLIC MOVE-OUT BOARD</div><h1>退租紀錄</h1><div class="sub">公開唯讀｜未完成退款顯示金額；已完成案件的財務資料自動封存</div></div><div class="chip" id="updated">● 讀取中</div></header>
<div class="notice">此頁不提供新增、修改或刪除功能。退款完成後，金額、退款日期與計算細節會自動從前台屏蔽，只保留退租完成狀態</div>
<section class="stats"><div class="st"><span>退租紀錄</span><b id="sAll">0</b></div><div class="st"><span>待退款</span><b id="sPending">0</b></div><div class="st"><span>已退款</span><b id="sPaid">0</b></div><div class="st"><span>待退總額</span><b id="sMoney">$0</b></div></section>
<section class="panel"><h2>退租明細</h2><div class="tbl"><table><thead><tr><th>狀態</th><th>房間</th><th>地址</th><th>點交日</th><th>應退金額</th><th>原預計退款日</th><th>說明</th></tr></thead><tbody id="tb"></tbody></table></div></section>
</main></div><script src="public-data.js"></script><script>
const D=window.HOUSE_PUBLIC_DATA,$=s=>document.querySelector(s),E=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m])),M=n=>"$"+Math.round(Number(n)||0).toLocaleString("zh-TW");
const a=D.checkouts;$("#sAll").textContent=a.length;$("#sPending").textContent=a.filter(x=>x.refund_status!=="paid").length;$("#sPaid").textContent=a.filter(x=>x.refund_status==="paid").length;$("#sMoney").textContent=M(a.filter(x=>x.refund_status!=="paid").reduce((s,x)=>s+(Number(x.refund_amount)||0),0));$("#updated").textContent="● 更新 "+new Date(D.updated_at).toLocaleString("zh-TW");$("#tb").innerHTML=a.map(r=>{const paid=r.refund_status==="paid";return `<tr><td><span class="badge ${paid?"paid":"pending"}">${paid?"已退款":"待退款"}</span></td><td><b>${E(r.room)}</b></td><td>${E(r.address)}</td><td>${E(r.checkout_date)}</td><td class="money">${paid?"已封存":M(r.refund_amount)}</td><td>${paid?"已封存":E(r.refund_due_date||"—")}</td><td>${paid?"退款完成，財務資料已轉後台":E(r.note||"—")}</td></tr>`}).join("");
</script></body></html>
