<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>家總管｜空房系統</title><link rel="stylesheet" href="public-style.css"></head><body>
<div class="app"><aside class="side"><div class="brand">家總管<small>HOUSE OPS · PUBLIC</small></div><nav class="nav"><a class="on" href="vacancy.html">空房系統</a><a href="checkout.html">退租紀錄</a><a href="weekly-accounting.html">每週帳務</a></nav><div class="foot"><a href="index.html">← 系統首頁</a></div></aside>
<main class="main"><header class="top"><div><div class="ey">PUBLIC VACANCY BOARD</div><h1>空房管理</h1><div class="sub">公開唯讀｜任何人可直接查看最新發布狀態，資料更新由管理視窗統一處理</div></div><div class="chip" id="updated">● 讀取中</div></header>
<div class="notice">此頁不需要登入。為避免敏感資訊外洩，門禁密碼、鑰匙位置、完整銀行帳號等不會出現在公開頁面</div>
<section class="stats"><div class="st"><span>目前空房</span><b id="sVac">0</b></div><div class="st"><span>近期已出租</span><b id="sRent">0</b></div><div class="st"><span>退租轉空房</span><b id="sCheckout">0</b></div><div class="st"><span>資料模式</span><b style="font-size:18px">公開唯讀</b></div></section>
<section class="panel"><h2>目前空房</h2><input id="q" class="search" placeholder="搜尋房號或地址"><div id="cards" class="cards"></div></section>
<section class="panel"><h2>近期已出租</h2><div class="tbl"><table><thead><tr><th>房間</th><th>地址</th><th>更新日期</th><th>狀態</th></tr></thead><tbody id="rented"></tbody></table></div></section>
</main></div><script src="public-data.js"></script><script>
const D=window.HOUSE_PUBLIC_DATA,$=s=>document.querySelector(s),E=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
function render(){const q=$("#q").value.trim().toLowerCase(),a=D.vacancies.filter(v=>[v.room,v.address,v.source].join(" ").toLowerCase().includes(q));$("#cards").innerHTML=a.map(v=>`<article class="card"><span class="badge vac">目前空房</span><h3>${E(v.room)}</h3><div class="addr">${E(v.address)}</div><div class="meta">${E(v.source||"")} ${v.since?"｜自 "+E(v.since):""}</div></article>`).join("")||'<div class="sub">沒有符合的空房</div>'}
$("#sVac").textContent=D.vacancies.length;$("#sRent").textContent=D.rented.length;$("#sCheckout").textContent=D.vacancies.filter(v=>v.source==="退租轉空房").length;$("#updated").textContent="● 更新 "+new Date(D.updated_at).toLocaleString("zh-TW");$("#rented").innerHTML=D.rented.map(r=>`<tr><td><b>${E(r.room)}</b></td><td>${E(r.address)}</td><td>${E(r.updated_at)}</td><td><span class="badge rent">已出租</span></td></tr>`).join("");$("#q").addEventListener("input",render);render();
</script></body></html>
