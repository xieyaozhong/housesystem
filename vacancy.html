<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>家總管｜空房系統</title><link rel="stylesheet" href="public-style.css"><link rel="stylesheet" href="secure-style.css"></head><body>
<div class="lock" id="lock"><div class="lockbox"><div class="ey">VACANCY SECURE</div><h2>空房系統登入</h2><p>輸入管理密碼後查看完整房務、門禁與備註資料</p><div class="lockrow"><input id="pw" class="secure-input" type="password" autocomplete="current-password" placeholder="管理密碼"><button id="unlock" class="unlock-btn">解鎖</button></div><div id="err" class="lockerr"></div></div></div>
<div class="app"><aside class="side"><div class="brand">家總管<small>HOUSE OPS · SECURE</small></div><nav class="nav"><a class="on" href="vacancy.html">空房系統</a><a href="checkout.html">退租紀錄</a><a href="weekly-accounting.html">每週帳務</a></nav><div class="foot"><button id="forget" class="secure-btn" style="width:100%">鎖定此裝置</button><a href="index.html">← 系統首頁</a></div></aside>
<main class="main"><header class="top"><div><div class="ey">FULL VACANCY CONTROL</div><h1>空房管理</h1><div class="sub">內部完整資料｜解鎖後顯示物件主檔、門禁、備註與房間狀態</div></div><div class="chip" id="updated">● 已加密</div></header><section class="stats"><div class="st"><span>目前空房</span><b id="sVac">0</b></div><div class="st"><span>近期已出租</span><b id="sRent">0</b></div><div class="st"><span>退租轉空房</span><b id="sCheckout">0</b></div><div class="st"><span>主檔物件</span><b id="sProps">0</b></div></section>
<section class="panel"><h2>目前空房</h2><input id="q" class="search" placeholder="搜尋房號、地址"><div id="cards" class="cards"></div></section>
<section class="panel"><h2>近期已出租</h2><div class="tbl"><table><thead><tr><th>房間</th><th>地址</th><th>更新日期</th><th>狀態</th></tr></thead><tbody id="rented"></tbody></table></div></section>
<section class="panel"><h2>物件主檔完整資訊</h2><div class="tbl"><table><thead><tr><th>ID</th><th>編號</th><th>地址</th><th>門禁／電錶</th><th>備註／物品</th><th>原始地址</th></tr></thead><tbody id="props"></tbody></table></div></section></main></div><script src="secure-data.js"></script><script src="trusted-device.js"></script><script src="ops-secure.js"></script><script src="finance-secure.js"></script><script src="secure-app.js"></script><script>
const $=s=>document.querySelector(s),E=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));let S=null;
function paint(){const o=S.ops,q=$("#q").value.trim().toLowerCase(),a=o.vacancies.filter(v=>[v.room,v.address,v.source].join(" ").toLowerCase().includes(q));$("#cards").innerHTML=a.map(v=>`<article class="card"><span class="badge vac">目前空房</span><h3>${E(v.room)}</h3><div class="addr">${E(v.address)}</div><div class="meta">${E(v.source||"")}${v.since?"｜自 "+E(v.since):""}</div>${v.rent!=null||v.power_rate!=null?`<div class="meta" style="margin-top:8px">${v.rent!=null?"月租 "+Number(v.rent).toLocaleString("zh-TW")+" 元":""}${v.rent!=null&&v.power_rate!=null?"｜":""}${v.power_rate!=null?"電費 "+E(v.power_rate)+" 元／度":""}</div>`:""}</article>`).join("")||'<div class="sub">沒有符合資料</div>'}
function render(session){S=session;const o=S.ops,v=S.vault;$("#lock").style.display="none";$("#sVac").textContent=o.vacancies.length;$("#sRent").textContent=o.rented.length;$("#sCheckout").textContent=o.vacancies.filter(x=>x.source==="退租轉空房").length;$("#sProps").textContent=(v.properties||[]).length;$("#updated").textContent="● 更新 "+new Date(o.updated_at).toLocaleString("zh-TW");$("#rented").innerHTML=o.rented.map(r=>`<tr><td><b>${E(r.room)}</b></td><td>${E(r.address)}</td><td>${E(r.updated_at)}</td><td><span class="badge rent">已出租</span></td></tr>`).join("");$("#props").innerHTML=(v.properties||[]).map(p=>`<tr><td>#${E(p.id)}</td><td>${E(p.code||"—")}</td><td>${E(p.address||"—")}</td><td class="account">${E(p.access||"—")}</td><td>${E(p.note||"—")}</td><td>${E(p.address_raw||"—")}</td></tr>`).join("");paint()}
async function unlock(){try{render(await HouseSecureApp.unlock($("#pw").value));$("#pw").value=""}catch(e){$("#err").textContent=e?.message||"無法解鎖"}}$("#q").oninput=()=>S&&paint();$("#unlock").onclick=unlock;$("#pw").onkeydown=e=>{if(e.key==="Enter")unlock()};$("#forget").onclick=async()=>{await HouseSecureApp.forget();location.reload()};(async()=>{const s=await HouseSecureApp.auto();if(s)render(s)})();
</script></body></html>
