<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>家總管｜上傳此瀏覽器資料</title>
<style>
:root{--b:#07111d;--p:#0d1a2a;--l:#22364f;--t:#f4f8fc;--m:#8fa5bb;--g:#79e2b8;--a:#82b7ff;--r:#ff9e9e}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#18324f,#07111d 55%);color:var(--t);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;min-height:100vh}.wrap{max-width:720px;margin:auto;padding:28px 16px}.ey{color:var(--g);font-size:10px;letter-spacing:.18em;font-weight:800}h1{margin:6px 0 8px}.sub{color:var(--m);font-size:12px;line-height:1.7}.panel{border:1px solid var(--l);background:var(--p);border-radius:18px;padding:18px;margin:15px 0}.count{font-size:42px;font-weight:900;margin:8px 0}.f{width:100%;padding:11px 12px;border-radius:11px;border:1px solid var(--l);background:#091625;color:#fff;outline:none}.lbl{display:block;color:#8ea3b9;font-size:10px;margin:12px 0 6px}.btn{border:1px solid var(--l);background:#102038;color:#d8e4ef;border-radius:11px;padding:11px 13px;cursor:pointer;text-decoration:none}.btn.primary{background:var(--g);color:#062519;border-color:var(--g);font-weight:850}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.status{border:1px solid #2b4b64;background:#0d2137;padding:12px;border-radius:12px;color:#afd0ef;font-size:12px;line-height:1.75}.ok{color:#9ceacc}.bad{color:#ffb0b0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:650px){.grid{grid-template-columns:1fr}.actions .btn{flex:1;text-align:center}}
</style>
</head><body><div class="wrap">
<div class="ey">LOCAL → CLOUD</div><h1>上傳此瀏覽器資料</h1>
<div class="sub">把這台裝置目前的退租／點交資料加密後寫進家總管雲端，同步完成後其他已配對裝置會收到同一批資料</div>
<div class="panel"><div class="sub">這台瀏覽器目前資料</div><div class="count" id="count">0</div><div id="detail" class="sub">正在讀取…</div></div>
<div class="panel">
<h2>雲端登入</h2><div id="authState" class="status">讀取 Firebase 狀態中…</div>
<div id="loginBox"><label class="lbl">管理員 Email</label><input id="email" class="f" type="email"><label class="lbl">Firebase 管理員密碼</label><input id="password" class="f" type="password"><div class="actions"><button id="login" class="btn">登入</button></div></div>
</div>
<div class="panel"><h2>加密並上傳</h2><div class="sub">如果這台裝置已設為信任裝置，可直接按上傳；否則輸入一次家總管管理密碼</div><label class="lbl">家總管管理密碼</label><input id="master" class="f" type="password" placeholder="信任裝置可留空"><div class="actions"><button id="upload" class="btn primary">↑ 上傳此瀏覽器全部資料</button><button id="refresh" class="btn">重新讀取本機資料</button></div><div id="result" class="status" style="margin-top:12px">尚未上傳</div></div>
<div class="actions"><a class="btn" href="vacancy.html">← 空房系統</a><a class="btn" href="checkout.html">退租點交</a><a class="btn" href="sync-setup.html">同步設定</a></div>
</div>
<script src="trusted-device.js"></script>
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js';
import { getAuth,setPersistence,browserLocalPersistence,signInWithEmailAndPassword,onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js';
import { getFirestore,doc,setDoc,serverTimestamp } from 'https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js';
const CONFIG_KEY='house_firebase_config_v1',LOCAL_KEY='house_ops_checkout_v1',COLLECTION='housesystem_checkouts';
const $=s=>document.querySelector(s),te=new TextEncoder();let auth=null,db=null,user=null,key=null,config=null,autoTried=false;
const b64=u=>btoa(String.fromCharCode(...new Uint8Array(u)));
function cfg(){try{return JSON.parse(localStorage.getItem(CONFIG_KEY)||'null')}catch(e){return null}}
function rows(){try{let a=JSON.parse(localStorage.getItem(LOCAL_KEY)||'[]');return Array.isArray(a)?a:[]}catch(e){return[]}}
function paintLocal(){const a=rows(),done=a.filter(x=>x.status==='completed').length;$('#count').textContent=a.length;$('#detail').textContent=`${a.length} 筆退租／點交紀錄，其中 ${done} 筆已完成並會自動列入空房`}
function paintAuth(){if(user){$('#authState').innerHTML=`<span class="ok">已登入</span><br>${user.email||'—'}<br>UID：${user.uid}`;$('#loginBox').style.display='none'}else{$('#authState').innerHTML='<span class="bad">尚未登入</span>';$('#loginBox').style.display='block'}}
async function derive(password){let base=await crypto.subtle.importKey('raw',te.encode(password),'PBKDF2',false,['deriveKey']);key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:te.encode(`housesystem-sync-v1|${config.projectId}`),iterations:250000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function encrypt(obj){let iv=crypto.getRandomValues(new Uint8Array(12)),ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,te.encode(JSON.stringify(obj)));return{v:1,iv:b64(iv),ct:b64(ct)}}
async function getMaster(){let p=$('#master').value;if(!p&&window.HouseTrusted?.has&&await window.HouseTrusted.has())p=await window.HouseTrusted.getRememberedPassword();if(!p)throw new Error('請輸入家總管管理密碼，或先將此裝置設為信任裝置');return p}
async function upload(silent=false){try{if(!config)throw new Error('這台瀏覽器尚未設定 Firebase，請先到跨裝置同步設定');if(!user)throw new Error('請先登入 Firebase 管理員帳號');const a=rows();$('#result').textContent=`正在加密並上傳 ${a.length} 筆…`;await derive(await getMaster());let ok=0,fail=0;for(const r of a){try{const enc=await encrypt(r);await setDoc(doc(db,COLLECTION,String(r.id)),{...enc,clientUpdatedAt:r.updated_at||new Date().toISOString(),updatedAt:serverTimestamp(),uid:user.uid,type:'checkout-v1'});ok++}catch(e){console.error(e);fail++}}$('#master').value='';$('#result').innerHTML=fail?`已完成部分上傳<br>成功 ${ok} 筆／失敗 ${fail} 筆`:`<span class="ok">上傳完成</span><br>${ok} 筆資料已寫入雲端<br>其他裝置現在可同步取得`;return{ok,fail}}catch(e){$('#result').innerHTML=`<span class="bad">尚未完成</span><br>${e.message}`;if(!silent)alert(e.message);throw e}}
async function autoUpload(){if(autoTried||!user)return;autoTried=true;try{if(await window.HouseTrusted?.has?.())await upload(true)}catch(e){}}
paintLocal();config=cfg();$('#email').value=localStorage.getItem('house_admin_email_v1')||'';
if(config&&config.apiKey&&config.authDomain&&config.projectId&&config.appId){try{const app=initializeApp(config,'housesystem-local-uploader');auth=getAuth(app);db=getFirestore(app);await setPersistence(auth,browserLocalPersistence);onAuthStateChanged(auth,u=>{user=u;paintAuth();if(u?.email)localStorage.setItem('house_admin_email_v1',u.email);autoUpload()})}catch(e){$('#authState').innerHTML=`<span class="bad">Firebase 初始化失敗</span><br>${e.message}`}}else{$('#authState').innerHTML='<span class="bad">尚未設定 Firebase</span><br>請先開啟「同步設定」完成一次 Firebase 設定'}
$('#login').onclick=async()=>{try{if(!auth)throw new Error('請先設定 Firebase');await signInWithEmailAndPassword(auth,$('#email').value.trim(),$('#password').value);$('#password').value=''}catch(e){alert('登入失敗：'+e.message)}};
$('#upload').onclick=()=>upload(false);$('#refresh').onclick=paintLocal;window.addEventListener('storage',e=>{if(e.key===LOCAL_KEY)paintLocal()});
</script></body></html>
